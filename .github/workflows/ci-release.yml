name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          6.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish Stub
      run: dotnet publish -p:PublishSingleFile=true -c Release -r win-x64 --self-contained false .\BloxstrapMigrator\BloxstrapMigrator.csproj

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj
    
    - name: Stage artifacts
      run: |
        mkdir staging
        copy .\BloxstrapMigrator\bin\Release\net6.0-windows\win-x64\publish\ staging\
        copy .\Bloxstrap\bin\Release\net10.0-windows\win-x64\publish\ staging\

    - name: Upload Artifact
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: Bloxstrap (Release) (${{ github.sha }})
        path: staging\

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Sign and download artifact
        uses: signpath/github-action-submit-signing-request@v2.2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '107b3de5-057b-42fc-a985-3546e4261775'
          project-slug: 'bloxstrap'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'github-ci'
          github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'release'

      - name: Rename binaries
        run: |
          mv release/BloxstrapMigrator.exe Migration-Handler.exe
          mv release/Bloxstrap.exe Bloxstrap-${{ github.ref_name }}.exe

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            Migration-Handler.exe
            Bloxstrap-${{ github.ref_name }}.exe
          name: Bloxstrap ${{ github.ref_name }}

  release-test:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-test')

    steps:
      - name: Sign and download artifact
        uses: signpath/github-action-submit-signing-request@v2.2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '107b3de5-057b-42fc-a985-3546e4261775'
          project-slug: 'bloxstrap'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'github-ci'
          github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'release'

      - name: Rename binaries
        run: |
          mv release/BloxstrapMigrator.exe Migration-Handler.exe
          mv release/Bloxstrap.exe Bloxstrap-${{ github.ref_name }}.exe

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            Migration-Handler.exe
            Bloxstrap-${{ github.ref_name }}.exe
          name: Bloxstrap ${{ github.ref_name }}
